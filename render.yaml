services:
  - type: web
    name: gpt-survey-chat
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ADMIN_KEY
        sync: false
      - key: CHAT_TIME_LIMIT_MINUTES
        value: "10"
      - key: CHAT_TIMER_START
        value: first_message
      - key: DB_PATH
        value: /data/data.db
    disk:
      name: gpt-survey-chat-data
      mountPath: /data
      sizeGB: 1
